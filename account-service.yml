server:
  port: 8082

spring:
  mongodb:
    uri: mongodb://localhost:27017/accountdb
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: account-service
      # earliest: si account-service arranca por primera vez despues de que yanki-service ya
      # publico solicitudes pendientes, tiene que procesarlas igual, no solo las nuevas.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.bootcamp.accountservice.event
        # yanki-service publica su PROPIA clase AccountOperationRequest (bounded context
        # distinto) - mismo criterio que auth-service/customer-service: usa.type.headers=false
        # fuerza a deserializar siempre contra la copia local (default.type), sin depender del
        # nombre de clase del productor embebido en un header.
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.bootcamp.accountservice.event.AccountOperationRequest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # yanki-service tiene su propia copia de AccountOperationResult, no depende de la clase
        # interna de account-service (mismo criterio que customer-service -> auth-service).
        spring.json.add.type.headers: false

customer-service:
  base-url: http://localhost:8081

card-service:
  base-url: http://localhost:8084

credit-service:
  base-url: http://localhost:8083

cache:
  customer:
    # D8 (2026-08-14): TTL corto sin invalidacion activa - el dato cacheado (nombre/documento)
    # no es sensible a un minuto de desfasaje, no justifica sumar un consumer Kafka nuevo.
    ttl-seconds: 60

bank:
  accounts:
    # D8 (2026-08-14): ninguno de estos montos viene del enunciado, son parametros de negocio
    # decididos con el usuario - por eso van todos en config, nunca hardcodeados en el codigo.
    savings:
      vip:
        min-daily-average: 500.00
        avg-shortfall-fee: 15.00
    checking:
      maintenance-fee: 15.00
    movements:
      # limite uniforme para SAVINGS y CHECKING (Parte II); FIXED_TERM no usa esta clave, su
      # propia regla de 1 movimiento/mes/dia fijo ya es mas estricta y nunca la superaria.
      free-monthly-limit: 5
      excess-fee: 5.00

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

resilience4j:
  circuitbreaker:
    instances:
      customer-service:
        sliding-window-size: 10
        # el default de Resilience4j es 100 - sin esto, el circuito nunca llega a evaluarse con
        # trafico bajo (encontrado probando de verdad con customer-service caido, no en el papel).
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # 404 (cliente inexistente) es una respuesta de negocio normal, no una falla tecnica -
        # si contara como falla, un id inventado terminaria abriendo el circuito para todos.
        ignore-exceptions:
          - com.bootcamp.accountservice.exception.CustomerNotFoundException
      # /cards/exists nunca devuelve 404 (responde true/false), no hace falta ignore-exceptions.
      card-service:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      # /credits/customers/{id}/has-overdue-debt tampoco tiene 404 de negocio, mismo criterio.
      credit-service:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      customer-service:
        timeout-duration: 2s
      card-service:
        timeout-duration: 2s
      credit-service:
        timeout-duration: 2s
