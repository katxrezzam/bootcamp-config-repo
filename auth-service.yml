server:
  port: 8086

spring:
  mongodb:
    uri: mongodb://localhost:27017/authdb
  data:
    mongodb:
      auto-index-creation: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: auth-service
      # earliest: al primer arranque (sin offset commiteado todavia) tiene que leer TODO el
      # historico del topic para poblar el directorio con los clientes que ya existian antes de
      # que auth-service arrancara por primera vez - no solo los nuevos desde ahora.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.bootcamp.authservice.event
        # customer-service publica su PROPIA clase CustomerEvent (bounded context distinto, no
        # se comparte modelo entre microservicios) - sin esto, el deserializer intentaria usar
        # el nombre de clase del productor (embebido por default en un header) y fallaria porque
        # esa clase no existe en el classpath de auth-service. Con use.type.headers=false, usa
        # el tipo del parametro del propio @KafkaListener (la copia local).
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.bootcamp.authservice.event.CustomerEvent

auth:
  jwt:
    # D-Fase3: en un banco real esto vive en un vault/secrets manager, no en un repo Git en
    # texto plano - se acepta aca por alcance de bootcamp. Tiene que coincidir EXACTO con el de
    # api-gateway (quien lo valida) - unica fuente de verdad, los dos lo leen del mismo
    # config-server.
    secret: "pqe65uJ3hfD926j1dW3mFHtq4ikR5GtOk_9NfjEc4pvRRROYzCLCwaqweQ-9Yq7R"
    expiration-minutes: 60

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
